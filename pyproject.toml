[tool.ruff]
line-length = 120
target-version = "py313"
exclude = [
    ".git",
    "venv",
    "data",
    "migrations",
    "prompt_spec.txt",
]

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]  # line length handled by formatter

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]


