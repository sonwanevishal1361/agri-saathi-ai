services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agrisaathi_app
    restart: unless-stopped
    ports:
      - "8501:8501"
    environment:
      - DATABASE_URL=postgresql://agrisaathi:secretpassword@db:5432/agrisaathi
      - APP_ENV=production
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.5-flash}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      - SENTRY_DSN=${SENTRY_DSN:-}
      - AI_DAILY_REQUEST_LIMIT=25
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - app_data:/app/data
      - app_logs:/app/logs

  db:
    image: postgres:16-alpine
    container_name: agrisaathi_db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=agrisaathi
      - POSTGRES_PASSWORD=secretpassword
      - POSTGRES_DB=agrisaathi
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agrisaathi -d agrisaathi"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  app_data:
  app_logs:
  postgres_data:

